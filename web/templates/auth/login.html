<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · Family Bot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: #0f1117;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
            overflow: hidden;
        }

        /* 背景网格动效 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(102,126,234,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(102,126,234,0.06) 1px, transparent 1px);
            background-size: 48px 48px;
            z-index: 0;
        }

        /* 光晕 */
        body::after {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(102,126,234,0.12) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        /* Logo 区 */
        .login-logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(102,126,234,0.4);
        }

        .logo-icon i {
            font-size: 30px;
            color: #fff;
        }

        .login-logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
        }

        .login-logo p {
            color: #6b7280;
            font-size: 0.85rem;
            margin-top: 6px;
        }

        /* 卡片 */
        .login-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 36px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 0 0 1px rgba(102,126,234,0.1),
                0 24px 64px rgba(0,0,0,0.4);
        }

        .login-card label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 1rem;
            pointer-events: none;
        }

        .input-wrap .toggle-eye {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 1rem;
            cursor: pointer;
            pointer-events: all;
            background: none;
            border: none;
            padding: 0;
            transition: color 0.2s;
        }

        .input-wrap .toggle-eye:hover {
            color: #667eea;
        }

        .form-control-dark {
            width: 100%;
            padding: 14px 48px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #f9fafb;
            font-size: 0.95rem;
            transition: all 0.2s;
            outline: none;
        }

        .form-control-dark::placeholder {
            color: #4b5563;
        }

        .form-control-dark:focus {
            background: rgba(255,255,255,0.08);
            border-color: rgba(102,126,234,0.6);
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }

        .form-control-dark.is-error {
            border-color: rgba(239,68,68,0.6);
            box-shadow: 0 0 0 3px rgba(239,68,68,0.1);
        }

        /* 错误提示 */
        .error-msg {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 10px;
            padding: 12px 14px;
            color: #fca5a5;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        /* 提交按钮 */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 24px;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0);
            transition: background 0.2s;
        }

        .btn-login:hover::before {
            background: rgba(255,255,255,0.1);
        }

        .btn-login:active {
            transform: scale(0.99);
        }

        /* 底部 */
        .login-footer {
            text-align: center;
            margin-top: 28px;
            color: #374151;
            font-size: 0.78rem;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-logo">
            <div class="logo-icon">
                <i class="bi bi-people-fill"></i>
            </div>
            <h1>Family Bot</h1>
            <p>Google 家庭组自动化管理平台</p>
        </div>

        <div class="login-card">
            {% if error %}
            <div class="error-msg">
                <i class="bi bi-exclamation-circle-fill"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
                <div class="mb-2">
                    <label>访问密码</label>
                    <div class="input-wrap">
                        <i class="bi bi-lock-fill"></i>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control-dark {% if error %}is-error{% endif %}"
                            placeholder="请输入访问密码"
                            autofocus
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-eye" onclick="togglePwd()" tabindex="-1">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="bi bi-arrow-right-circle me-2"></i>进入系统
                </button>
            </form>
        </div>

        <div class="login-footer">
            &copy; 2025 Family Bot &nbsp;·&nbsp; Powered by Playwright
        </div>
    </div>

    <script>
        function togglePwd() {
            const inp = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (inp.type === 'password') {
                inp.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                inp.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        // 回车提交
        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') this.form.submit();
        });
    </script>
</body>
</html>
