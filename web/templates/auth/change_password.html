<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 · Family Bot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: #0f1117;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(102,126,234,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(102,126,234,0.06) 1px, transparent 1px);
            background-size: 48px 48px;
            z-index: 0;
        }
        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 56px; height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 8px 32px rgba(102,126,234,0.4);
        }
        .logo-icon i { font-size: 26px; color: #fff; }
        .logo h1 { font-size: 1.3rem; font-weight: 700; color: #fff; }
        .logo p { color: #6b7280; font-size: 0.82rem; margin-top: 4px; }

        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 32px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 0 1px rgba(102,126,234,0.1), 0 24px 64px rgba(0,0,0,0.4);
        }
        .card-title {
            font-size: 1rem;
            font-weight: 700;
            color: #e5e7eb;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }
        .field { margin-bottom: 18px; }
        .input-wrap { position: relative; }
        .input-wrap i.prefix {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%);
            color: #6b7280; font-size: 0.95rem; pointer-events: none;
        }
        .form-input {
            width: 100%;
            padding: 13px 44px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 11px;
            color: #f9fafb;
            font-size: 0.92rem;
            outline: none;
            transition: all 0.2s;
        }
        .form-input::placeholder { color: #4b5563; }
        .form-input:focus {
            background: rgba(255,255,255,0.08);
            border-color: rgba(102,126,234,0.6);
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }
        .form-input.is-error {
            border-color: rgba(239,68,68,0.6);
            box-shadow: 0 0 0 3px rgba(239,68,68,0.1);
        }
        .alert-error {
            display: flex; align-items: center; gap: 8px;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 10px;
            padding: 12px 14px;
            color: #fca5a5;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        .alert-success {
            display: flex; align-items: center; gap: 8px;
            background: rgba(34,197,94,0.1);
            border: 1px solid rgba(34,197,94,0.2);
            border-radius: 10px;
            padding: 12px 14px;
            color: #86efac;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 11px;
            color: #fff;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-submit:hover { opacity: 0.9; }
        .btn-submit:active { transform: scale(0.99); }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #6b7280;
            font-size: 0.83rem;
            text-decoration: none;
        }
        .back-link:hover { color: #9ca3af; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="logo">
        <div class="logo-icon"><i class="bi bi-people-fill"></i></div>
        <h1>Family Bot</h1>
        <p>修改访问密码</p>
    </div>

    <div class="card">
        <div class="card-title">
            <i class="bi bi-shield-lock" style="color:#667eea;"></i> 安全设置
        </div>

        {% if error %}
        <div class="alert-error">
            <i class="bi bi-exclamation-circle-fill"></i> {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="alert-success">
            <i class="bi bi-check-circle-fill"></i> {{ success }}
        </div>
        <a href="/login" class="back-link"><i class="bi bi-arrow-left me-1"></i>去登录</a>
        {% else %}
        <form method="POST">
            <div class="field">
                <label>当前密码</label>
                <div class="input-wrap">
                    <i class="bi bi-lock prefix"></i>
                    <input type="password" name="current_password" class="form-input {% if error %}is-error{% endif %}" placeholder="输入当前密码" autofocus>
                </div>
            </div>
            <div class="field">
                <label>新密码</label>
                <div class="input-wrap">
                    <i class="bi bi-key prefix"></i>
                    <input type="password" name="new_password" class="form-input" placeholder="至少 4 位">
                </div>
            </div>
            <div class="field">
                <label>确认新密码</label>
                <div class="input-wrap">
                    <i class="bi bi-key-fill prefix"></i>
                    <input type="password" name="confirm_password" class="form-input" placeholder="再次输入新密码">
                </div>
            </div>
            <button type="submit" class="btn-submit">
                <i class="bi bi-check2-circle me-1"></i>确认修改
            </button>
        </form>
        <a href="/" class="back-link"><i class="bi bi-arrow-left me-1"></i>返回首页</a>
        {% endif %}
    </div>
</div>
</body>
</html>
