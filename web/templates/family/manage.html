{% extends "base.html" %}
{% block title %}家庭组 · {{ parent.email }} - Family Bot{% endblock %}

{% block extra_head %}
<style>
    .member-card { border-radius: 12px; padding: 16px 20px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; transition: all .15s; }
    .member-card:hover { transform: translateY(-1px); }
    .member-active { background: #f0fdf4; border: 1px solid #bbf7d0; }
    .member-pending { background: #fffbeb; border: 1px solid #fde68a; }
    .member-manager { background: #eff6ff; border: 1px solid #bfdbfe; }
    .member-info { display: flex; align-items: center; gap: 12px; }
    .member-avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: .9rem; }
    .av-manager { background: linear-gradient(135deg, #667eea, #764ba2); }
    .av-active { background: linear-gradient(135deg, #10b981, #059669); }
    .av-pending { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .role-badge { font-size: .7rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    .role-manager { background: #dbeafe; color: #1e40af; }
    .role-member { background: #d1fae5; color: #065f46; }
    .role-pending { background: #fef3c7; color: #92400e; }
    .spinner-box { text-align: center; padding: 3rem; color: #9ca3af; }
    .spinner-box i { font-size: 2rem; }
    .op-result { margin-top: 12px; }
    #inviteForm { max-width: 500px; }
</style>
{% endblock %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h4><i class="bi bi-house-heart me-2" style="color:#667eea;"></i>家庭组管理</h4>
        <small class="text-muted">家长: {{ parent.email }} ({{ parent.nickname }})</small>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-primary btn-sm" onclick="refreshMembers()">
            <i class="bi bi-arrow-clockwise me-1"></i>刷新成员列表
        </button>
        <a href="/family/" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>返回
        </a>
    </div>
</div>

<!-- 操作结果提示 -->
<div id="opAlert" class="alert d-none" role="alert"></div>

<!-- 成员列表区域 -->
<div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center" style="background:#f8f9fb;">
        <span class="fw-semibold"><i class="bi bi-people me-2"></i>Google 家庭组成员</span>
        <span id="memberCount" class="badge bg-light text-dark">-</span>
    </div>
    <div class="card-body" id="memberListArea">
        <div class="text-center text-muted py-4">
            <i class="bi bi-arrow-up-circle" style="font-size:2rem;opacity:.4;"></i>
            <p class="mt-2">点击「刷新成员列表」获取 Google 家庭组的实际成员</p>
        </div>
    </div>
</div>

<!-- 邀请新成员 -->
<div class="card mb-4">
    <div class="card-header" style="background:#f8f9fb;">
        <span class="fw-semibold"><i class="bi bi-person-plus me-2"></i>邀请新成员</span>
    </div>
    <div class="card-body">
        <form id="inviteForm" onsubmit="inviteMember(event)">
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                <input type="email" id="inviteEmail" class="form-control" placeholder="输入成员邮箱 (例: user@gmail.com)" required>
                <button type="submit" class="btn btn-success" id="inviteBtn">
                    <i class="bi bi-send me-1"></i>发送邀请
                </button>
            </div>
        </form>
        <div id="inviteResult" class="op-result"></div>
    </div>
</div>

<!-- 批量邀请 -->
<div class="card mb-4">
    <div class="card-header" style="background:#f8f9fb;">
        <span class="fw-semibold"><i class="bi bi-people-fill me-2"></i>批量邀请</span>
    </div>
    <div class="card-body">
        <form id="batchInviteForm" onsubmit="batchInvite(event)">
            <div class="mb-2">
                <textarea id="batchEmails" class="form-control" rows="4" placeholder="每行一个邮箱&#10;user1@gmail.com&#10;user2@gmail.com"></textarea>
            </div>
            <button type="submit" class="btn btn-success btn-sm" id="batchInviteBtn">
                <i class="bi bi-send me-1"></i>批量发送邀请
            </button>
        </form>
        <div id="batchInviteResult" class="op-result"></div>
    </div>
</div>

<script>
const PARENT_ID = {{ parent.id }};

function showAlert(msg, type) {
    const el = document.getElementById('opAlert');
    el.className = 'alert alert-' + type + ' alert-dismissible fade show';
    el.innerHTML = msg + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>';
}

function pollTask(taskId, callback) {
    const poll = setInterval(() => {
        fetch('/family/task/' + taskId)
            .then(r => r.json())
            .then(data => {
                if (data.status === 'done' || data.status === 'failed') {
                    clearInterval(poll);
                    callback(data);
                }
            })
            .catch(() => clearInterval(poll));
    }, 2000);
}

function refreshMembers() {
    const area = document.getElementById('memberListArea');
    area.innerHTML = '<div class="spinner-box"><div class="spinner-border text-primary" role="status"></div><p class="mt-2">正在获取家庭组成员列表，请稍候...</p><p class="text-muted" style="font-size:.8rem;">需要登录 Google 账号并访问家庭组页面，通常需要 15-30 秒</p></div>';

    fetch('/family/' + PARENT_ID + '/list_members', { method: 'POST' })
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                area.innerHTML = '<div class="text-center text-danger py-3"><i class="bi bi-exclamation-triangle" style="font-size:1.5rem;"></i><p class="mt-2">' + data.error + '</p></div>';
                return;
            }
            pollTask(data.task_id, renderMembers);
        })
        .catch(err => {
            area.innerHTML = '<div class="text-center text-danger py-3">请求失败: ' + err + '</div>';
        });
}

function renderMembers(taskData) {
    const area = document.getElementById('memberListArea');
    const countEl = document.getElementById('memberCount');

    if (taskData.status === 'failed') {
        area.innerHTML = '<div class="text-center text-danger py-3"><i class="bi bi-exclamation-triangle" style="font-size:1.5rem;"></i><p class="mt-2">获取失败: ' + (taskData.error || '未知错误') + '</p></div>';
        return;
    }

    const members = taskData.result || [];
    countEl.textContent = members.length + ' 人';

    if (members.length === 0) {
        area.innerHTML = '<div class="text-center text-muted py-3"><i class="bi bi-inbox" style="font-size:1.5rem;"></i><p class="mt-2">未找到家庭组成员，可能页面结构已变化</p></div>';
        return;
    }

    let html = '';
    members.forEach(m => {
        const isManager = m.role === 'manager';
        const isPending = m.status === 'pending';
        const cardClass = isManager ? 'member-manager' : (isPending ? 'member-pending' : 'member-active');
        const avClass = isManager ? 'av-manager' : (isPending ? 'av-pending' : 'av-active');
        const roleClass = isManager ? 'role-manager' : (isPending ? 'role-pending' : 'role-member');
        const roleText = isManager ? '管理员' : (isPending ? '待接受' : '成员');

        html += '<div class="member-card ' + cardClass + '">';
        html += '  <div class="member-info">';
        html += '    <div class="member-avatar ' + avClass + '">' + (m.name || m.email || '?')[0].toUpperCase() + '</div>';
        html += '    <div>';
        html += '      <div class="fw-semibold" style="font-size:.9rem;">' + (m.name || '-') + '</div>';
        html += '      <div class="text-muted" style="font-size:.78rem;">' + (m.email || '-') + '</div>';
        html += '    </div>';
        html += '    <span class="role-badge ' + roleClass + '">' + roleText + '</span>';
        html += '  </div>';
        html += '  <div class="d-flex gap-2">';

        if (!isManager && !isPending) {
            html += '<button class="btn btn-outline-danger btn-xs" onclick="kickMember(\'' + escHtml(m.email || m.name) + '\')"><i class="bi bi-person-dash me-1"></i>踢出</button>';
        }
        if (isPending) {
            html += '<button class="btn btn-outline-warning btn-xs" onclick="cancelInvite(\'' + escHtml(m.email || m.name) + '\')"><i class="bi bi-x-circle me-1"></i>取消邀请</button>';
        }

        html += '  </div>';
        html += '</div>';
    });

    area.innerHTML = html;
}

function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function kickMember(target) {
    if (!confirm('确定踢出成员 ' + target + '？此操作不可撤销！')) return;
    showAlert('<i class="bi bi-hourglass-split me-2"></i>正在踢出 ' + target + '，请稍候...', 'info');

    fetch('/family/' + PARENT_ID + '/kick', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({target: target})
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) { showAlert('<i class="bi bi-x-circle me-2"></i>' + data.error, 'danger'); return; }
        pollTask(data.task_id, (res) => {
            if (res.status === 'done') {
                showAlert('<i class="bi bi-check-circle me-2"></i>成员 ' + target + ' 已踢出', 'success');
                refreshMembers();
            } else {
                showAlert('<i class="bi bi-x-circle me-2"></i>踢出失败: ' + (res.error || '未知错误'), 'danger');
            }
        });
    });
}

function cancelInvite(target) {
    if (!confirm('确定取消对 ' + target + ' 的邀请？')) return;
    showAlert('<i class="bi bi-hourglass-split me-2"></i>正在取消邀请 ' + target + '...', 'info');

    fetch('/family/' + PARENT_ID + '/cancel_invite', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({target: target})
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) { showAlert('<i class="bi bi-x-circle me-2"></i>' + data.error, 'danger'); return; }
        pollTask(data.task_id, (res) => {
            if (res.status === 'done') {
                showAlert('<i class="bi bi-check-circle me-2"></i>已取消对 ' + target + ' 的邀请', 'success');
                refreshMembers();
            } else {
                showAlert('<i class="bi bi-x-circle me-2"></i>取消邀请失败: ' + (res.error || '未知错误'), 'danger');
            }
        });
    });
}

function inviteMember(e) {
    e.preventDefault();
    const email = document.getElementById('inviteEmail').value.trim();
    if (!email) return;

    const btn = document.getElementById('inviteBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>发送中...';

    fetch('/family/' + PARENT_ID + '/invite', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: email})
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            document.getElementById('inviteResult').innerHTML = '<div class="alert alert-danger py-2">' + data.error + '</div>';
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-send me-1"></i>发送邀请';
            return;
        }
        pollTask(data.task_id, (res) => {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-send me-1"></i>发送邀请';
            if (res.status === 'done') {
                document.getElementById('inviteResult').innerHTML = '<div class="alert alert-success py-2"><i class="bi bi-check-circle me-2"></i>邀请已发送至 ' + email + '</div>';
                document.getElementById('inviteEmail').value = '';
            } else {
                document.getElementById('inviteResult').innerHTML = '<div class="alert alert-danger py-2"><i class="bi bi-x-circle me-2"></i>邀请失败: ' + (res.error || '未知错误') + '</div>';
            }
        });
    })
    .catch(err => {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-send me-1"></i>发送邀请';
        document.getElementById('inviteResult').innerHTML = '<div class="alert alert-danger py-2">请求失败</div>';
    });
}

function batchInvite(e) {
    e.preventDefault();
    const text = document.getElementById('batchEmails').value.trim();
    if (!text) return;

    const emails = text.split('\n').map(l => l.trim()).filter(l => l && l.includes('@'));
    if (emails.length === 0) {
        document.getElementById('batchInviteResult').innerHTML = '<div class="alert alert-warning py-2">未找到有效邮箱</div>';
        return;
    }

    const btn = document.getElementById('batchInviteBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>批量发送中 (0/' + emails.length + ')...';

    let done = 0, success = 0, fail = 0;
    const resultArea = document.getElementById('batchInviteResult');
    resultArea.innerHTML = '';

    emails.forEach((email, idx) => {
        fetch('/family/' + PARENT_ID + '/invite', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: email})
        })
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                fail++;
                done++;
                updateBatchProgress();
                return;
            }
            pollTask(data.task_id, (res) => {
                done++;
                if (res.status === 'done') success++;
                else fail++;
                updateBatchProgress();
            });
        })
        .catch(() => { done++; fail++; updateBatchProgress(); });
    });

    function updateBatchProgress() {
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>批量发送中 (' + done + '/' + emails.length + ')...';
        resultArea.innerHTML = '<div class="alert alert-info py-2">进度: ' + done + '/' + emails.length + ' | 成功: ' + success + ' | 失败: ' + fail + '</div>';
        if (done >= emails.length) {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-send me-1"></i>批量发送邀请';
            resultArea.innerHTML = '<div class="alert alert-' + (fail === 0 ? 'success' : 'warning') + ' py-2"><i class="bi bi-' + (fail === 0 ? 'check-circle' : 'exclamation-triangle') + ' me-2"></i>批量邀请完成: 成功 ' + success + ' 个，失败 ' + fail + ' 个</div>';
        }
    }
}
</script>
{% endblock %}
